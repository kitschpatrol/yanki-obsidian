overrides:
  # Match obsidian-typings' pin so a single obsidian instance is resolved,
  # otherwise its module augmentations don't apply to our obsidian import
  '@codemirror/state': 6.5.2
  '@expo/plist@0.0.18>@xmldom/xmldom': 0.8.13
  mermaid: ^11.16.0
publicHoistPattern:
  - '@kitschpatrol/repo-config'
  - '@kitschpatrol/typescript-config'
  - 'case-police'
  - '*cspell*'
  - '*eslint*'
  - '*knip*'
  - '*mdat*'
  - '*prettier*'
  - '*remark*'
  - '*stylelint*'
allowBuilds:
  electron: true
  esbuild: true
  obsidian-typings: false
  oxc-resolver: true
  puppeteer: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@kitschpatrol/*'
  - 'eslint-plugin-obsidianmd'
  - 'yanki-connect'
  - 'yanki'
  - '@obsidian-typings/*'
  - 'obsidian-typings'
