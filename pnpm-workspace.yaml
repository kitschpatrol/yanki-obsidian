overrides:
  '@expo/plist@0.0.18>@xmldom/xmldom': 0.8.13
  mermaid: ^11.15.0
peerDependencyRules:
  allowedVersions:
    'eslint-plugin-obsidianmd>obsidian': '1.6.6'
publicHoistPattern:
  - '@kitschpatrol/repo-config'
  - '@kitschpatrol/typescript-config'
  - 'case-police'
  - '*cspell*'
  - '*eslint*'
  - '*knip*'
  - '*mdat*'
  - '*prettier*'
  - '*remark*'
  - '*stylelint*'
allowBuilds:
  electron: true
  esbuild: true
  oxc-resolver: true
  puppeteer: true
  unrs-resolver: true
